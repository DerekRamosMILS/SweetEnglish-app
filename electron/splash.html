<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 400px; height: 300px;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    -webkit-app-region: drag;
    user-select: none;
  }

  .card {
    width: 100%; height: 100%;
    background: #FFFFFF;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .heart {
    width: 88px; height: 88px;
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    color: #1A1A2E;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 13px;
    color: #9A9AB0;
    font-weight: 500;
  }

  .dots span {
    animation: blink 1.2s infinite;
    animation-fill-mode: both;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40%           { opacity: 1;   }
  }
</style>
</head>
<body>
<div class="card">
  <svg class="heart" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#FF6B9D"/>
        <stop offset="100%" stop-color="#E8638C"/>
      </linearGradient>
    </defs>
    <path fill="url(#hg)"
      d="M50 85 C50 85 15 60 15 35 C15 22 24 14 35 14 C41 14 47 17 50 22 C53 17 59 14 65 14 C76 14 85 22 85 35 C85 60 50 85 50 85Z"/>
  </svg>

  <div class="title">SweetEnglish</div>

  <div class="subtitle">
    Iniciando<span class="dots"><span>.</span><span>.</span><span>.</span></span>
  </div>
</div>
</body>
</html>
